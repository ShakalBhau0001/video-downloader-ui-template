<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Downloader UI Template</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container">
        <div class="col-md-6 offset-md-3">
            <div class="card p-4">

                <h3 class="text-center mb-3">🎬 Video Downloader UI</h3>
                <p class="text-center text-muted">Frontend Template</p>

                <form class="form-download">
                    <div class="mb-3">
                        <label>Video URL</label>
                        <input type="text" class="form-control link" placeholder="Paste video link here...">
                    </div>

                    <div class="mb-3">
                        <label>Select Format</label>
                        <select class="form-select formte">
                            <option value="" disabled selected>Select Video Format</option>
                            <option value="mp3">MP3</option>
                            <option value="360">MP4 - 360p</option>
                            <option value="720">MP4 - 720p</option>
                            <option value="1080">MP4 - 1080p</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-success w-100 click-btn-down"> Download </button>
                </form>

                <div class="result-box download-video"></div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
